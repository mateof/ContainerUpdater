name: CI

# Verificacion en ramas y pull requests. En main lo hace el workflow de release,
# asi que aqui se excluye para no ejecutar dos veces lo mismo en cada push.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Construye la imagen sin publicarla, para que un Dockerfile roto se detecte
  # en la rama y no al hacer merge a main. Solo amd64: el objetivo es que
  # compile, no producir el artefacto final.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Avisa en el PR de si la version cambia o no. No falla: hay cambios que no
  # merecen version nueva y forzarlo llevaria a subirla sin criterio.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Comparar la version con main
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          BASE="$(git show origin/${{ github.base_ref }}:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"

          if [ "$CURRENT" = "$BASE" ]; then
            echo "::notice::La version sigue en $CURRENT. Si este PR cambia el comportamiento, subela antes de mergear o no se publicara imagen nueva."
          else
            echo "::notice::Version: $BASE -> $CURRENT. Al mergear se publicara la imagen."
          fi
