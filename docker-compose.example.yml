# ContainerUpdater en un Synology NAS con Container Manager.
#
# Copia este fichero a /volume1/docker/container-updater/docker-compose.yml,
# crea el .env al lado (ver .env.example) y crea el proyecto desde
# Container Manager apuntando a esa carpeta.

services:
  container-updater:
    # Se fija una version concreta a proposito, no `latest`: asi sabes lo que
    # tienes y actualizas cuando tu quieras. Las versiones publicadas estan en
    # https://github.com/mateof/ContainerUpdater/releases
    image: ghcr.io/mateof/container-updater:latest
    container_name: container-updater
    restart: unless-stopped

    # El socket de Docker ya concede privilegios equivalentes a root en el NAS,
    # asi que correr como root DENTRO del contenedor no empeora la situacion y
    # evita tener que averiguar el GID del grupo docker, que cambia entre
    # modelos y versiones de DSM. Si prefieres no hacerlo, mira la nota del
    # README sobre group_add.
    user: "0:0"

    # Se usa la red bridge que ya existe en vez de crear una propia.
    #
    # Compose crea por defecto una red por proyecto, y los rangos de direcciones
    # que reparte Docker son limitados: con una docena larga de proyectos se
    # agotan y cualquier stack nuevo falla con
    #   "could not find an available, non-overlapping IPv4 address pool"
    #
    # Esta aplicacion no necesita red propia: habla con Docker por el socket,
    # que es un fichero, y solo necesita salida a internet para consultar los
    # registries. Asi no gasta uno de esos rangos.
    #
    # Si prefieres aislarla en su propia red, quita esta linea. Y si el error de
    # arriba ya te ha aparecido, mira docs/SYNOLOGY.md.
    network_mode: bridge

    ports:
      # Solo en la LAN. No abras este puerto en el router: quien llegue a esta
      # aplicacion controla todos los contenedores del NAS.
      - "8099:8080"

    environment:
      TZ: Europe/Madrid
      CU_DEFAULT_LOCALE: es

      # Clave maestra de 32 bytes en base64 que cifra las credenciales de
      # registry. GUARDALA FUERA DEL NAS: sin ella no se pueden recuperar.
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      CU_ENCRYPTION_KEY: ${CU_ENCRYPTION_KEY}

      # Solo se usan en el primer arranque. Si las omites, la aplicacion genera
      # una contrasena y la escribe una vez en los logs del contenedor.
      CU_ADMIN_USER: ${CU_ADMIN_USER:-admin}
      CU_ADMIN_PASSWORD: ${CU_ADMIN_PASSWORD:-}

      # Opcional: bot de Telegram. Sin token, la aplicacion funciona igual.
      CU_TELEGRAM_BOT_TOKEN: ${CU_TELEGRAM_BOT_TOKEN:-}

      # Cada 6 horas. Comprobar mas a menudo despierta los discos del NAS sin
      # que nadie publique imagenes a esa velocidad.
      CU_CHECK_CRON: "0 */6 * * *"

      # Carpetas dentro de las cuales se acepta ejecutar compose. Acepta lista
      # separada por comas si tienes proyectos en varios volumenes.
      #
      # Opcional desde 0.6.0: sin definirla se deduce de donde el propio Docker
      # dice que estan tus proyectos. Definirla desactiva esa deduccion.
      CU_COMPOSE_ROOTS: /volume1/docker

      # Carpeta donde se crean los proyectos que hagas desde la web.
      #
      # NO HACE FALTA en el montaje de abajo: sin definirla se usa la primera
      # carpeta de proyectos que admita escritura, con lo que los proyectos
      # nuevos aparecen junto a los que ya tienes, que es lo normal.
      #
      # Solo tiene sentido definirla si quieres que los proyectos nuevos vayan a
      # OTRO sitio distinto del de los existentes (ver la nota del montaje).
      # CU_PROJECTS_DIR: /volume1/docker/proyectos

      # Opcional desde 0.6.0: sin definirlo se sondean los sockets habituales
      # de Docker y de Podman.
      DOCKER_HOST: unix:///var/run/docker.sock
      CU_HOST_PROC: /host/proc

    volumes:
      # Acceso al daemon de Docker. Es lo que permite ver y actualizar los
      # contenedores.
      - /var/run/docker.sock:/var/run/docker.sock

      # Base de datos, sesiones y credenciales cifradas.
      - /volume1/docker/container-updater/data:/data

      # IMPRESCINDIBLE Y CON LA MISMA RUTA A AMBOS LADOS.
      #
      # Las labels de compose que ponen los contenedores guardan rutas del NAS
      # (por ejemplo /volume1/docker/n8n/docker-compose.yml). Solo resuelven
      # dentro de este contenedor si el punto de montaje coincide exactamente.
      # Montarlo en otro sitio rompe la estrategia de compose y todo pasaria a
      # recrearse por API.
      #
      # SIN ":ro" para poder crear proyectos desde la web. Es la misma carpeta
      # donde ya viven tus stacks: los nuevos se crean ahi al lado, cada uno en
      # su subcarpeta. Que la aplicacion no pise uno existente no depende de
      # este montaje sino del propio codigo, que se niega a crear sobre una
      # carpeta que ya existe y solo deja editar lo que se creo desde la web.
      #
      # Si no vas a crear proyectos desde aqui, ponle ":ro". Compose solo
      # necesita LEER el YAML, y los volumenes que declaren los servicios los
      # resuelve el daemon del NAS sin pasar por este montaje.
      #
      # Si prefieres que la carpeta con tus stacks siga siendo de solo lectura
      # Y ademas poder crear proyectos, monta las dos y apunta CU_PROJECTS_DIR
      # a la segunda:
      #   - /volume1/docker:/volume1/docker:ro
      #   - /volume1/docker/proyectos:/volume1/docker/proyectos
      - /volume1/docker:/volume1/docker

      # Metricas reales del NAS (CPU, memoria, carga, uptime). Sin este montaje
      # la aplicacion funciona, pero muestra metricas aproximadas y lo indica.
      - /proc:/host/proc:ro

    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    logging:
      # Sin limite, los logs de un contenedor que lleva meses en marcha se
      # comen el volumen del sistema del NAS.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
